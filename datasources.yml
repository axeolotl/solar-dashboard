apiVersion: 1

datasources:
  - name: Postgres
    # plugin id of the bundled PostgreSQL data source since Grafana 10.3
    # ("postgres" is still accepted as an alias)
    type: grafana-postgresql-datasource
    # fixed uid, referenced by dashboard.json
    uid: solar-postgres
    url: postgres:5432
    isDefault: true
    editable: false
    user: grafanareader
    secureJsonData:
      # PG_GRAFANA_PASSWORD from config.sh, passed to the container by docker-compose.yml
      password: $__env{PG_GRAFANA_PASSWORD}
    jsonData:
      database: postgres
      sslmode: "disable" # disable/require/verify-ca/verify-full
      maxOpenConns: 0 # 0 = unlimited
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500 # highest selectable option ("15+"), used for PostgreSQL 18
      timescaledb: false
