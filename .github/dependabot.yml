# Dependabot version updates, see UPDATING.md ("Automating update runs").
# Config is read from the default branch. Every PR is checked by the
# smoke test workflow (.github/workflows/smoke-test.yml).
version: 2
updates:
  # image tags in docker-compose.yml (grafana, postgres, caddy)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    groups:
      # patch updates of all images in one PR - merged automatically once the
      # smoke test is green (.github/workflows/dependabot-automerge.yml)
      patch:
        update-types: ["patch"]
      # minor updates in one PR, merged manually after review
      minor:
        update-types: ["minor"]
      # major updates get separate PRs, they often need changes to
      # dashboard.json / datasources.yml / SQL (see UPDATING.md)
    commit-message:
      prefix: "docker"
    open-pull-requests-limit: 5

  # actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
