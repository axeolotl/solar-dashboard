services:
  caddy:
    image: caddy:2.11.7
    networks:
      - frontnet
    ports:
      - 80:80
      - 443:443
      - 443:443/udp # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and ACME account, must persist
      - caddy-config:/config
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
    depends_on:
      - grafana
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3-ubuntu
    # no published ports: only reachable through caddy
    networks:
      - frontnet
      - grafnet
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/all.yml:ro
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/all.yml:ro
      - ./dashboard.json:/etc/grafana/dashboards/solar-dashboard.json:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${DASHBOARD_DOMAIN}
      GF_SERVER_ROOT_URL: https://${DASHBOARD_DOMAIN}/
      GF_SECURITY_COOKIE_SECURE: "true"
      PG_GRAFANA_PASSWORD: ${PG_GRAFANA_PASSWORD}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  # one-shot job: creates/updates the viewer user from config.sh
  grafana-users:
    # same image as grafana (kept as literal tag so that update bots bump both)
    image: grafana/grafana:13.2.3-ubuntu
    entrypoint: ["bash", "/grafana-users.sh"]
    networks:
      - frontnet
    volumes:
      - ./grafana-users.sh:/grafana-users.sh:ro
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_VIEWER_USER: ${GRAFANA_VIEWER_USER:-}
      GRAFANA_VIEWER_PASSWORD: ${GRAFANA_VIEWER_PASSWORD:-}
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.6
    container_name: postgres
    networks:
      - grafnet
    environment:
      - POSTGRES_PASSWORD=${PG_ADMIN_PASSWORD}
    volumes:
      # PostgreSQL 18+ images keep PGDATA in a version-specific
      # subdirectory (/var/lib/postgresql/18/docker), so the volume
      # is mounted at /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
      - ${SOLAR_HEAT_DIR}:/tmp/SC514:ro
    restart: unless-stopped

networks:
  # caddy <-> grafana
  frontnet:
  # grafana <-> postgres, no connection to the outside
  grafnet:
    internal: true

volumes:
  # all volumes are managed by compose (named solar_dashboard_<name>); the
  # former external grafana-storage volume is migrated by docker-up.sh
  grafana-storage:
  postgres-data:
  caddy-data:
  caddy-config:
